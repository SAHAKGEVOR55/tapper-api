<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap to Earn Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .user-info {
            font-size: 18px;
            margin-bottom: 10px;
            color: #aaaaaa;
        }

        .score-container {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .coin {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .coin:active {
            transform: scale(0.92);
        }

        /* +1 Լողացող տեքստի անիմացիա */
        .tap-pop {
            position: absolute;
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="user-info" id="username">Բարև, Խաղացող</div>
    <div class="score-container">
        <span>🪙</span>
        <span id="score">0</span>
    </div>

    <div class="coin" id="coinBtn">🪙</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Բացել պատուհանը ամբողջ էկրանով

        let score = 0;
        const scoreEl = document.getElementById('score');
        const coinBtn = document.getElementById('coinBtn');
        const usernameEl = document.getElementById('username');

        // Ցույց տալ օգտատիրոջ անունը Telegram-ից
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            usernameEl.innerText = `Բարև, ${tg.initDataUnsafe.user.first_name}!`;
        }

        coinBtn.addEventListener('click', (e) => {
            score++;
            scoreEl.innerText = score;

            // Haptic Feedback (թույլ թրթռում կոճակը սեղմելիս)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // +1 անիմացիա մատի սեղմած տեղում
            createPopText(e.clientX, e.clientY);
        });

        function createPopText(x, y) {
            const pop = document.createElement('div');
            pop.className = 'tap-pop';
            pop.innerText = '+1';
            pop.style.left = `${x - 15}px`;
            pop.style.top = `${y - 20}px`;
            document.body.appendChild(pop);

            setTimeout(() => {
                pop.remove();
            }, 800);
        }
    </script>
</body>
</html>
